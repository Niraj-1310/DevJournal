{% extends "layout.html" %}

{% block title %}
Reset Password | DevJournal
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">🔑</div>

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

            </div>

            <button
                type="submit"
                class="form-btn"
            >
                Reset Password
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</section>

{% endblock %}

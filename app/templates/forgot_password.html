{% extends "layout.html" %}

{% block title %}
Forgot Password | DevJournal
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">🔐</div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your email address and we'll send you a
                link to reset your password.
            </p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>

            <button
                type="submit"
                class="form-btn"
            >
                Send Reset Link
            </button>

        </form>

        <div class="auth-footer">

            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
